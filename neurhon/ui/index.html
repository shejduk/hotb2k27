<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>neurhon</title>
  <link rel="icon" type="image/png" href="img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap">

  <!-- Tailwind play CDN: utility classes (flex, gap-3, ...) work straight from the HTML, no build step. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Instrument Serif"', '"Iowan Old Style"', 'Georgia', 'serif'],
            body: ['Figtree', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="font-body">
  <!-- Large faint rho behind everything. Purely decorative. -->
  <div class="rho-watermark" aria-hidden="true"></div>

  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="rho-mark" aria-hidden="true"></span>
        <span>neurhon</span>
      </div>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div id="rail-status" class="rail-status" aria-live="polite"></div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
