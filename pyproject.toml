[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neurhon"
version = "0.0.0"
dependencies = [
    "brainaccess-board",
    "brainaccess",
    "rich",
    "requests",
    "pylast",
    "python-dotenv",
    "spotipy"
]

[project.scripts]
neurhon-run = "neurhon.entry:run"
